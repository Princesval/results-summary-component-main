<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">


</head>
<body>

  <main>
    <section id="result-section">
      <h1>Your Result</h1>
      <div id="result-div">
          <p id="big-num">76</p>
          <p id="small-num">of 100</p>
      </div>
      <h2>Great</h2>
      <p id="info">You scored higher than 65% of the people who have taken these tests.</p>
    </section>
    
    <section id="summary-section">
      <h2>Summary</h2>

      <div id="reaction-div">
        <p style="color: hsl(0, 100%, 67%);">
          <img src="assets/images/icon-reaction.svg" alt="">
          Reaction
        </p>
        <p class="result-p"><strong>80</strong> / 100</p>
      </div>

      <div id="memory-div">
        <p style="color: hsl(39, 100%, 56%);">
          <img src="assets/images/icon-memory.svg" alt="">
          Memory
        </p>
        <p class="result-p"><strong>92</strong> / 100</p>
      </div>

      <div id="verbal-div">
        <p style="color: hsl(166, 100%, 37%);">
          <img src="assets/images/icon-verbal.svg" alt="">
          Verbal
        </p>
        <p class="result-p"><strong>61</strong> / 100</p>
      </div>

      <div id="visual-div">
        <p style="color: hsl(234, 85%, 45%);">
          <img src="assets/images/icon-visual.svg" alt="">
          Visual
        </p>
        <p class="result-p"><strong>72</strong> / 100</p>
      </div>

      <button>Continue</button>
    </section>
  </main>
  
  
    <footer>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://github.com/Princesval" target="_blank">João Vitor Princesval Caetano</a>.
    </footer>
</body>
</html>
